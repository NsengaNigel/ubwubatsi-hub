<style>
  body { background-color: #fff8f5; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) both; }
  .du-1 { animation-delay: 0ms; }
  .du-2 { animation-delay: 80ms; }

  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

  .card-shell {
    background: rgba(245,236,231,0.45);
    border-radius: 1.25rem;
    padding: 5px;
    border: 1px solid #dcc1b5;
  }
  .card-core {
    background: #fff8f5;
    border-radius: calc(1.25rem - 5px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    padding: 36px 40px;
  }
  @media (min-width: 640px) { .card-core { padding: 44px 48px; } }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: #99420d; color: #ffffff;
    border-radius: 999px; padding: 12px 24px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    transition: background-color 0.4s cubic-bezier(0.32,0.72,0,1), transform 0.15s;
  }
  .btn-primary:hover { background-color: #7a3000; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-icon {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .input-field {
    width: 100%; background: rgba(255,255,255,0.7);
    border: 1px solid #dcc1b5; border-radius: 0.75rem;
    padding: 11px 16px; font-size: 15px; line-height: 22px; color: #1e1b18;
    outline: none;
    transition: border-color 0.3s cubic-bezier(0.32,0.72,0,1), box-shadow 0.3s;
  }
  .input-field:focus { border-color: #99420d; box-shadow: 0 0 0 3px rgba(153,66,13,0.08); }
  .input-field::placeholder { color: #897268; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid rgba(153,66,13,0.25); background: rgba(153,66,13,0.05); color: #99420d;
    border-radius: 999px; padding: 4px 12px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* Role toggle */
  .role-toggle {
    display: flex;
    background: rgba(239,230,226,0.6);
    border: 1px solid #dcc1b5;
    border-radius: 999px;
    padding: 4px;
    position: relative;
  }
  .role-indicator {
    position: absolute;
    top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px);
    background: #99420d;
    border-radius: 999px;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .role-btn {
    flex: 1; text-align: center; position: relative; z-index: 1;
    padding: 8px 12px; font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    border-radius: 999px; cursor: pointer; border: none; background: transparent;
    transition: color 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .role-btn.active { color: #ffffff; }
  .role-btn:not(.active) { color: #56433a; }
</style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-6 py-12">

<div class="w-full max-w-sm fade-up du-1">
  <div class="card-shell">
    <div class="card-core">

      <!-- Logo -->
      <a class="font-headline-md text-headline-md font-bold text-primary block mb-6" href="index.html">Ubwubatsi Hub</a>

      <!-- Header -->
      <div class="mb-7">
        <span class="eyebrow mb-3">
          <span class="material-symbols-outlined" style="font-size:12px; font-variation-settings:'FILL' 1;">person_add</span>
          Create account
        </span>
        <h1 class="font-headline-lg text-on-surface mt-3" style="letter-spacing:-0.02em;">Join the network</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant mt-1.5">Rwanda's premier platform for construction professionals.</p>
      </div>

      <!-- Role toggle -->
      <div class="role-toggle mb-6" id="roleToggle">
        <div class="role-indicator" id="toggle-indicator"></div>
        <button class="role-btn active" id="btn-client" onclick="selectRole('client')" type="button">Client</button>
        <button class="role-btn" id="btn-pro" onclick="selectRole('professional')" type="button">Professional</button>
      </div>

      <!-- Form -->
      <form class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="font-label-sm text-label-sm text-on-surface" for="fullName">Full name</label>
          <input class="input-field" id="fullName" name="fullName" placeholder="Your full name" required type="text"/>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="font-label-sm text-label-sm text-on-surface" for="email">Email address</label>
          <input class="input-field" id="email" name="email" placeholder="you@example.com" required type="email"/>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="font-label-sm text-label-sm text-on-surface" for="phone">Phone number</label>
          <input class="input-field" id="phone" name="phone" placeholder="+250 7XX XXX XXX" required type="tel"/>
        </div>

        <div class="flex flex-col gap-1.5 hidden" id="professional-fields">
          <label class="font-label-sm text-label-sm text-on-surface" for="regNumber">Registration number <span class="text-on-surface-variant">(RIA / Engineers Rwanda)</span></label>
          <input class="input-field" id="regNumber" name="regNumber" placeholder="RIA/XXXX/2024" type="text"/>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
          <input class="input-field" id="password" name="password" placeholder="Create a strong password" required type="password"/>
        </div>

        <button class="btn-primary w-full justify-center mt-2" type="submit">
          Create account
          <span class="btn-icon">
            <span class="material-symbols-outlined" style="font-size:14px;">arrow_forward</span>
          </span>
        </button>
      </form>

      <!-- Footer link -->
      <p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-7 pt-5 border-t border-outline-variant">
        Already have an account?
        <a class="text-primary font-medium hover:underline ml-1" href="login.html">Log in</a>
      </p>

    </div>
  </div>
</div>

<script>
  let currentRole = 'client';

  function selectRole(role) {
    currentRole = role;
    const indicator = document.getElementById('toggle-indicator');
    const btnClient = document.getElementById('btn-client');
    const btnPro = document.getElementById('btn-pro');
    const proFields = document.getElementById('professional-fields');
    const regInput = document.getElementById('regNumber');

    if (role === 'client') {
      indicator.style.transform = 'translateX(0)';
      btnClient.classList.add('active');
      btnPro.classList.remove('active');
      proFields.classList.add('hidden');
      regInput.removeAttribute('required');
      regInput.value = '';
    } else {
      indicator.style.transform = 'translateX(100%)';
      btnPro.classList.add('active');
      btnClient.classList.remove('active');
      proFields.classList.remove('hidden');
      regInput.setAttribute('required', 'true');
    }
  }

  // Also track clicks via event listeners (belt-and-suspenders)
  document.getElementById('btn-client').addEventListener('click', () => { currentRole = 'client'; });
  document.getElementById('btn-pro').addEventListener('click', () => { currentRole = 'professional'; });

  const registerForm = document.querySelector('form');
  const submitBtn = registerForm.querySelector('button[type="submit"]');
  const submitBtnHTML = submitBtn.innerHTML;

  const errorMsg = document.createElement('p');
  errorMsg.style.cssText = 'color:#ba1a1a;font-size:14px;line-height:20px;margin-bottom:8px;display:none;';
  submitBtn.parentNode.insertBefore(errorMsg, submitBtn);

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const registrationNumber = document.getElementById('regNumber').value.trim();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';
    try {
      const res = await fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullName, email, phone, password,
          role: currentRole,
          registrationNumber: currentRole === 'professional' ? registrationNumber : undefined
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Registration failed. Please try again.');
      localStorage.setItem('ubwubatsi_token', data.token);
      localStorage.setItem('ubwubatsi_user', JSON.stringify(data.user));
      window.location.href = data.user.role === 'professional' ? 'dashboard-pro.html' : 'client-dashboard.html';
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = submitBtnHTML;
    }
  });
</script>
</body>
</html>
