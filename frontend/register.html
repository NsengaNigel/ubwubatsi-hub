            "secondary": "#934b19",
            "primary": "#99420d",
            "surface-tint": "#9c440f",
            "tertiary-fixed": "#f1dfd1",

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md text-on-surface antialiased">
<!-- Main Card Container -->
<main class="w-full max-w-md bg-surface border border-outline-variant rounded-xl p-stack-lg shadow-[0_4px_24px_rgba(153,66,13,0.02)]">
<!-- Header -->
<header class="text-center mb-stack-lg">
<a class="font-headline-md text-headline-md text-primary mb-2 block" href="index.html">Ubwubatsi Hub</a>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Create an Account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Join Rwanda's premier network for structural integrity and design.</p>
</header>
<!-- Role Selector Toggle -->
<div class="flex bg-surface-container-high border border-outline-variant rounded-full p-1 mb-stack-lg relative w-full overflow-hidden">
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-primary rounded-full transition-transform duration-300 ease-in-out shadow-sm" id="toggle-indicator"></div>
<button class="flex-1 py-2 text-center rounded-full font-label-md text-label-md text-on-primary relative z-10 transition-colors focus:outline-none" id="btn-client" onclick="selectRole('client')" type="button">
Client
</button>
<button class="flex-1 py-2 text-center rounded-full font-label-md text-label-md text-on-surface-variant relative z-10 transition-colors focus:outline-none hover:text-on-surface" id="btn-pro" onclick="selectRole('professional')" type="button">
Professional
</button>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Full Name -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface mb-1" for="fullName">Full Name</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="fullName" name="fullName" placeholder="Enter your full name" required type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface mb-1" for="email">Email Address</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="email" name="email" placeholder="name@example.com" required type="email"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface mb-1" for="phone">Phone Number</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="phone" name="phone" placeholder="+250 7XX XXX XXX" required type="tel"/>
</div>
<!-- Dynamic Professional Field -->
<div class="flex flex-col hidden overflow-hidden transition-all duration-300" id="professional-fields">
<label class="font-label-sm text-label-sm text-on-surface mb-1" for="regNumber">Registration Number (RIA or Engineers Rwanda)</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="regNumber" name="regNumber" placeholder="e.g. RIA/XXXX/2024" type="text"/>
</div>
<!-- Password -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface mb-1" for="password">Password</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="password" name="password" placeholder="Create a strong password" required type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-3 px-4 rounded-lg font-label-md text-label-md text-center hover:bg-surface-tint transition-colors mt-stack-sm flex items-center justify-center gap-2" type="submit">
Register
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-stack-lg text-center border-t border-outline-variant pt-stack-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
Already have an account?
<a class="font-label-md text-label-md text-primary underline hover:text-secondary transition-colors" href="login.html">Login</a>
</p>
</div>
</main>
<script>
    function selectRole(role) {
        const btnClient = document.getElementById('btn-client');
        const btnPro = document.getElementById('btn-pro');
        const indicator = document.getElementById('toggle-indicator');
        const proFields = document.getElementById('professional-fields');
        const regInput = document.getElementById('regNumber');

        if (role === 'client') {
            indicator.style.transform = 'translateX(0)';
            btnClient.classList.replace('text-on-surface-variant', 'text-on-primary');
            btnClient.classList.remove('hover:text-on-surface');
            btnPro.classList.replace('text-on-primary', 'text-on-surface-variant');
            btnPro.classList.add('hover:text-on-surface');
            proFields.classList.add('hidden');
            regInput.removeAttribute('required');
            regInput.value = '';
        } else {
            indicator.style.transform = 'translateX(100%)';
            btnPro.classList.replace('text-on-surface-variant', 'text-on-primary');
            btnPro.classList.remove('hover:text-on-surface');
            btnClient.classList.replace('text-on-primary', 'text-on-surface-variant');
            btnClient.classList.add('hover:text-on-surface');
            proFields.classList.remove('hidden');
            regInput.setAttribute('required', 'true');
        }
    }
</script>
<script>
  // Track current role alongside the existing selectRole toggle
  let currentRole = 'client';
  document.getElementById('btn-client').addEventListener('click', () => { currentRole = 'client'; });
  document.getElementById('btn-pro').addEventListener('click', () => { currentRole = 'professional'; });

  const registerForm = document.querySelector('form');
  const submitBtn = registerForm.querySelector('button[type="submit"]');
  const submitBtnHTML = submitBtn.innerHTML;

  // Error message element injected above the submit button
  const errorMsg = document.createElement('p');
  errorMsg.style.cssText = 'color:#ba1a1a;font-size:14px;line-height:20px;margin-bottom:8px;display:none;';
  submitBtn.parentNode.insertBefore(errorMsg, submitBtn);

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const registrationNumber = document.getElementById('regNumber').value.trim();

    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Registering…';

    try {
      const res = await fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullName, email, phone, password,
          role: currentRole,
          registrationNumber: currentRole === 'professional' ? registrationNumber : undefined
        })
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.message || 'Registration failed. Please try again.');

      localStorage.setItem('ubwubatsi_token', data.token);
      localStorage.setItem('ubwubatsi_user', JSON.stringify(data.user));

      window.location.href = data.user.role === 'professional' ? 'dashboard-pro.html' : 'client-dashboard.html';

    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = submitBtnHTML;
    }
  });
</script>
</body>
</html>
