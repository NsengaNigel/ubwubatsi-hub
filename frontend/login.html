<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Ubwubatsi Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "on-secondary-container":"#783603","inverse-on-surface":"#f8efea","tertiary":"#665a4f",
        "secondary-fixed":"#ffdbc9","surface-container":"#f5ece7","on-tertiary":"#ffffff",
        "on-tertiary-fixed-variant":"#50453a","surface-container-low":"#fbf2ed","error":"#ba1a1a",
        "background":"#fff8f5","inverse-primary":"#ffb693","on-primary-container":"#fffbff",
        "tertiary-fixed-dim":"#d4c4b6","on-tertiary-container":"#fffbff",
        "surface-container-high":"#efe6e2","surface-container-highest":"#e9e1dc",
        "primary-fixed":"#ffdbcc","outline":"#897268","on-background":"#1e1b18",
        "outline-variant":"#dcc1b5","secondary-container":"#ffa26a",
        "on-primary-fixed-variant":"#7a3000","secondary-fixed-dim":"#ffb68c",
        "on-error-container":"#93000a","surface":"#fff8f5","surface-container-lowest":"#ffffff",
        "inverse-surface":"#34302c","error-container":"#ffdad6","on-primary":"#ffffff",
        "surface-variant":"#e9e1dc","primary-container":"#b95925","on-surface":"#1e1b18",
        "tertiary-container":"#7f7266","surface-bright":"#fff8f5","on-surface-variant":"#56433a",
        "on-error":"#ffffff","surface-dim":"#e1d8d4","primary-fixed-dim":"#ffb693",
        "on-secondary-fixed-variant":"#753401","on-secondary-fixed":"#321200",
        "on-secondary":"#ffffff","on-tertiary-fixed":"#231a11","secondary":"#934b19",
        "primary":"#99420d","surface-tint":"#9c440f","tertiary-fixed":"#f1dfd1",
        "on-primary-fixed":"#351000"
      },
      borderRadius: { "DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem" },
      spacing: {
        "stack-md":"16px","unit":"8px","gutter":"24px","margin-desktop":"40px",
        "margin-mobile":"16px","stack-sm":"8px","stack-lg":"32px","container-max-width":"1280px"
      },
      fontFamily: {
        "body-md":["Inter"],"label-sm":["Inter"],"headline-lg":["Hanken Grotesk"],
        "headline-lg-mobile":["Hanken Grotesk"],"body-sm":["Inter"],"display-lg":["Hanken Grotesk"],
        "body-lg":["Inter"],"label-md":["Inter"],"headline-md":["Hanken Grotesk"]
      },
      fontSize: {
        "body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],
        "label-sm":["12px",{"lineHeight":"16px","fontWeight":"500"}],
        "headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}],
        "headline-lg-mobile":["24px",{"lineHeight":"32px","fontWeight":"600"}],
        "body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],
        "display-lg":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],
        "body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],
        "label-md":["14px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],
        "headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}]
      }
    }
  }

<style>
  body { background-color: #fff8f5; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) both; }
  .du-1 { animation-delay: 0ms; }
  .du-2 { animation-delay: 80ms; }
  .du-3 { animation-delay: 150ms; }
  .du-4 { animation-delay: 220ms; }

  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

  .card-shell {
    background: rgba(245,236,231,0.45);
    border-radius: 1.25rem;
    padding: 5px;
    border: 1px solid #dcc1b5;
  }
  .card-core {
    background: #fff8f5;
    border-radius: calc(1.25rem - 5px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    padding: 40px;
  }
  @media (min-width: 640px) { .card-core { padding: 48px; } }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: #99420d; color: #ffffff;
    border-radius: 999px; padding: 12px 24px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    transition: background-color 0.4s cubic-bezier(0.32,0.72,0,1), transform 0.15s;
  }
  .btn-primary:hover { background-color: #7a3000; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-icon {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .input-field {
    width: 100%; background: rgba(255,255,255,0.7);
    border: 1px solid #dcc1b5; border-radius: 0.75rem;
    padding: 12px 16px; font-size: 16px; line-height: 24px; color: #1e1b18;
    outline: none;
    transition: border-color 0.3s cubic-bezier(0.32,0.72,0,1), box-shadow 0.3s;
  }
  .input-field:focus { border-color: #99420d; box-shadow: 0 0 0 3px rgba(153,66,13,0.08); }
  .input-field::placeholder { color: #897268; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid rgba(153,66,13,0.25); background: rgba(153,66,13,0.05); color: #99420d;
    border-radius: 999px; padding: 4px 12px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  }
</style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-sm fade-up du-1">
  <div class="card-shell">
    <div class="card-core">

      <!-- Logo -->
      <a class="font-headline-md text-headline-md font-bold text-primary block mb-8" href="index.html">Ubwubatsi Hub</a>

      <!-- Header -->
      <div class="mb-8">
        <span class="eyebrow mb-4">
          <span class="material-symbols-outlined" style="font-size:12px; font-variation-settings:'FILL' 1;">lock</span>
          Sign in
        </span>
        <h1 class="font-headline-lg text-on-surface mt-3" style="letter-spacing:-0.02em;">Welcome back</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mt-2">Enter your details to continue building.</p>
      </div>

      <!-- Form -->
      <form class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label class="font-label-sm text-label-sm text-on-surface" for="email">Email address</label>
          <input class="input-field" id="email" name="email" placeholder="you@example.com" required type="email"/>
        </div>

        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
            <a class="font-body-sm text-body-sm text-primary hover:text-surface-tint transition-colors" href="#">Forgot password?</a>
          </div>
          <div class="relative">
            <input class="input-field" id="password" name="password" placeholder="••••••••" required type="password" style="padding-right: 48px;"/>
            <button aria-label="Toggle visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
              <span class="material-symbols-outlined" style="font-size:20px;">visibility</span>
            </button>
          </div>
        </div>

        <button class="btn-primary w-full justify-center mt-1" type="submit">
          Log in
          <span class="btn-icon">
            <span class="material-symbols-outlined" style="font-size:14px;">arrow_forward</span>
          </span>
        </button>
      </form>

      <!-- Footer link -->
      <p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-8 pt-6 border-t border-outline-variant">
        New to Ubwubatsi Hub?
        <a class="text-primary font-medium hover:underline ml-1" href="register.html">Create an account</a>
      </p>

    </div>
  </div>
</div>

<script>
  const loginForm = document.querySelector('form');
  const submitBtn = loginForm.querySelector('button[type="submit"]');
  const submitBtnHTML = submitBtn.innerHTML;

  const errorMsg = document.createElement('p');
  errorMsg.style.cssText = 'color:#ba1a1a;font-size:14px;line-height:20px;margin-bottom:8px;display:none;';
  submitBtn.parentNode.insertBefore(errorMsg, submitBtn);

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';
    try {
      const res = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed. Please check your credentials.');
      localStorage.setItem('ubwubatsi_token', data.token);
      localStorage.setItem('ubwubatsi_user', JSON.stringify(data.user));
      window.location.href = data.user.role === 'professional' ? 'dashboard-pro.html' : 'client-dashboard.html';
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = submitBtnHTML;
    }
  });
</script>
</body>
</html>
