<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-background">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface rounded-xl border border-surface-variant p-stack-lg md:p-[48px] shadow-sm flex flex-col gap-stack-lg">
<!-- Header -->
<header class="text-center flex flex-col gap-stack-sm">
<a class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary" href="index.html">Ubwubatsi Hub</a>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please enter your details.</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-stack-md">
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="bg-surface border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="email" name="email" placeholder="Enter your email" required type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="password" name="password" placeholder="Enter your password" required type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm bg-primary text-on-primary font-label-md text-label-md py-[12px] px-[16px] rounded-DEFAULT hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-[0_4px_14px_0_rgba(153,66,13,0.1)]" type="submit">
Login
</button>
</form>
<!-- Footer Links -->
<div class="text-center mt-stack-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
Don't have an account?
<a class="font-label-md text-label-md text-primary hover:text-secondary hover:underline transition-all ml-1" href="register.html">Register</a>
</p>
</div>
</main>
<script>
  const loginForm = document.querySelector('form');
  const submitBtn = loginForm.querySelector('button[type="submit"]');
  const submitBtnHTML = submitBtn.innerHTML;

  // Error message element injected above the submit button
  const errorMsg = document.createElement('p');
  errorMsg.style.cssText = 'color:#ba1a1a;font-size:14px;line-height:20px;margin-bottom:8px;display:none;';
  submitBtn.parentNode.insertBefore(errorMsg, submitBtn);

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
      const res = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.message || 'Login failed. Please check your credentials.');

      localStorage.setItem('ubwubatsi_token', data.token);
      localStorage.setItem('ubwubatsi_user', JSON.stringify(data.user));

      window.location.href = data.user.role === 'professional' ? 'dashboard-pro.html' : 'client-dashboard.html';

    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = submitBtnHTML;
    }
  });
</script>
</body>
</html>
